name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # ghcr needs the owner name in lowercase
  REGISTRY: ghcr.io/shreyash-beyond-journeys-end

jobs:
  # 1. run the backend tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v

  # 2. check that the frontend builds
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # 3. build docker images, scan them with trivy, push to ghcr
  image:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $REGISTRY/placetrack-${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}

      # fails the job if there is a HIGH or CRITICAL CVE that has a fix
      # (pinned to a commit because trivy-action tags were hijacked in 2026)
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/placetrack-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # only push on main, pull requests just build and scan
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push $REGISTRY/placetrack-${{ matrix.service }}:${{ github.sha }}

  # 4. deploy to minikube on my laptop (self-hosted runner)
  # only runs when the repo variable DEPLOY_ENABLED is true, because my laptop is not always on
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # kubectl and helm are installed in ~/.local/bin on my laptop
      - name: Add tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Helm upgrade with the new image tag
        run: ./scripts/deploy.sh ${{ github.sha }}

      - name: Wait for the rollout
        run: |
          kubectl -n placetrack rollout status deploy/placetrack-backend --timeout=180s
          kubectl -n placetrack rollout status deploy/placetrack-frontend --timeout=180s

      - name: Show pods
        run: kubectl -n placetrack get pods
