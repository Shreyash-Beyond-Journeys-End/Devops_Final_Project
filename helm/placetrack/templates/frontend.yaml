apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: placetrack
      component: frontend
  template:
    metadata:
      labels:
        app: placetrack
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/placetrack-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # full dns name, because the nginx resolver does not use the k8s search domains
            - name: BACKEND_URL
              value: "http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc.cluster.local:8000"
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  type: ClusterIP
  selector:
    app: placetrack
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
