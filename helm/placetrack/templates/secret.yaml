# database password
# made randomly on the first install, then the same one is reused on every upgrade
# (lookup reads the secret that is already in the cluster)
{{- $name := printf "%s-db" .Release.Name }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # keep it after helm uninstall, the postgres volume still uses this password
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{- if $old }}
  password: {{ index $old.data "password" }}
  database-url: {{ index $old.data "database-url" }}
{{- else }}
  {{- $password := randAlphaNum 24 }}
  password: {{ $password | b64enc }}
  database-url: {{ printf "postgresql+psycopg://placetrack:%s@%s-postgres:5432/placetrack" $password .Release.Name | b64enc }}
{{- end }}
